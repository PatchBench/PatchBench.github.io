# Site-wide metadata. Everything shown in the header, hero and citation
# comes from here; edit this file rather than the templates.

title: PatchBench
subtitle: Evaluating AI Agents for Vulnerability Patching
description: >-
  PatchBench is a C/C++ repository-level vulnerability patching benchmark
  that mitigates patch memorization and validates both the security and the
  semantic correctness of agent patches.
lede: >-
  Most patching benchmarks accept a patch once the original proof-of-concept
  stops crashing. PatchBench hides the root cause off the crash stack,
  transplants and mutates each vulnerability so memorized fixes no longer
  apply, and checks that a patch behaves correctly on both vulnerable and
  benign inputs.
affiliation: University of Maryland

