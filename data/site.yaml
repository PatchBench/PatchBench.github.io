# Headline numbers. `agents` and `inflation` are computed from
# data/leaderboard.yaml at build time, so they are not listed here.
stats:
  tasks: 213
  projects: 32
  cwes: 16
  budget_per_task_usd: 5

# The example card next to the title: CVE-2022-1276 in mruby (paper Figure 3).
example:
  cve: CVE-2022-1276
  project: mruby
  headline: crash in the VM, bug in the compiler
  agent:
    file: src/class.c
    where: crash site
    function: mrb_get_args
    lines:
      - [ctx, "argv_on_stack = argc < 15;"]
      - [ctx, "if (!argv_on_stack) {"]
      - [add, "  if (!mrb_array_p(*argv))"]
      - [add, "    mrb_argnum_error(mrb, argc, argc_min, argc_max);"]
      - [ctx, "  struct RArray *a = mrb_ary_ptr(*argv);"]
  reference:
    file: mrbgems/mruby-compiler/core/codegen.c
    short_file: …/mruby-compiler/core/codegen.c   # shown in the card; full path on hover
    where: root cause
    function: gen_assignment
    lines:
      - [ctx, "if (tree->cdr->car) {"]
      - [del, "  if (n == 14) {"]
      - [add, "  if (n == 13) {"]
      - [ctx, "    pop_n(n);"]

