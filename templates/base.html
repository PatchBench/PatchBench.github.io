<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){var r=document.documentElement;try{var s=localStorage.getItem("patchbench:theme");if(s==="dark"||s==="light")r.dataset.theme=s}catch(_){}r.classList.add("js-fade");setTimeout(function(){r.classList.add("bar-ready","is-ready")},3000)})();</script>
  <title>{% block title %}{{ site.title }}: {{ site.subtitle }}{% endblock %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta property="og:title" content="{{ site.title }}: {{ site.subtitle }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="static/css/style.css?v={{ build_id }}">
  <script src="static/js/site.js?v={{ build_id }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="wordmark" href="index.html" aria-label="{{ site.title }} home">
        <svg class="wordmark-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v5H11z"/><rect x="13.5" y="13.5" width="8.5" height="8.5" rx="2.5"/></svg>
        <span>{{ site.title }}</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="{{ '' if page_id == 'index' else 'index.html' }}#leaderboard"{% if page_id == 'index' %} aria-current="page"{% endif %}>Leaderboard</a>
        <a href="benchmark.html"{% if page_id == 'benchmark' %} aria-current="page"{% endif %}>Benchmark</a>
        <a href="contribute.html"{% if page_id == 'contribute' %} aria-current="page"{% endif %}>Contribute</a>
        <a href="{{ site.links.paper }}" target="_blank" rel="noopener noreferrer">Paper<span aria-hidden="true"> ↗</span><span class="sr-only"> (opens in a new tab)</span></a>
        <a href="{{ site.links.code }}" target="_blank" rel="noopener noreferrer">Code<span aria-hidden="true"> ↗</span><span class="sr-only"> (opens in a new tab)</span></a>
        <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    <div class="wrap colophon-inner">
      <p>© {{ year }} <strong>{{ site.title }}</strong> · {{ site.affiliation }}</p>
    </div>
  </footer>

  <div class="tooltip" role="tooltip" hidden></div>
</body>
</html>
